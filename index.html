function azCrop(file,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(url);cb(file)};
  im.onload=function(){
    var R=window.AZ_CROP_R||[8,9],ct=esc(t("crop")).replace("8:9",R[0]+":"+R[1]),W=288,H=Math.round(288*R[1]/R[0]),OW=1080,OH=Math.round(1080*R[1]/R[0]),z=1,ox=0,oy=0,base=Math.max(W/im.width,H/im.height);
    var m=document.createElement("div");m.className="sheet";
    m.innerHTML='<div role="dialog" aria-label="'+ct+'"><h3>'+ct+'</h3><canvas width="'+W+'" height="'+H+'" style="width:'+W+'px;max-width:100%;touch-action:none;border-radius:12px;border:1px solid var(--ln)"></canvas><input type="range" min="1" max="3" step="0.01" value="1" style="width:100%" aria-label="Zoom"><p class="tt">'+esc(t("cropHint"))+'</p><div class="row"><button type="button" class="chip" id="azcx">'+esc(t("cropCancel"))+'</button><button type="button" class="btn" id="azcu">'+esc(t("cropUse"))+'</button></div></div>';
    document.body.appendChild(m);
    var cv=m.querySelector("canvas"),rg=m.querySelector("input");
    function clamp(){var s=base*z,mx=Math.max(0,(im.width*s-W)/2),my=Math.max(0,(im.height*s-H)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}
    function paint(c,k){var s=base*z,dw=im.width*s,dh=im.height*s,x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);x.drawImage(im,k*(W/2+ox-dw/2),k*(H/2+oy-dh/2),k*dw,k*dh)}
    paint(cv,1);
    var dr=null;
    cv.onpointerdown=function(e){dr={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=function(e){if(!dr)return;ox+=e.clientX-dr.x;oy+=e.clientY-dr.y;dr={x:e.clientX,y:e.clientY};clamp();paint(cv,1)};
    cv.onpointerup=cv.onpointercancel=function(){dr=null};
    rg.oninput=function(){z=+rg.value;clamp();paint(cv,1)};
    function end(){m.remove();URL.revokeObjectURL(url)}
    m.querySelector("#azcx").onclick=function(){end();cb(null)};
    m.querySelector("#azcu").onclick=function(){var oc=document.createElement("canvas");oc.width=OW;oc.height=OH;paint(oc,OW/W);oc.toBlob(function(b){end();cb(b)},"image/jpeg",0.97)};
  };
  im.src=url;
}

// Resizes in smooth steps, sharpens lightly, and never makes a file larger than the old 720px JPEG.
function azDraw(src,w,h){var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(src,0,0,w,h);return c}
function azScale(im,max){
  var s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),cur=im;
  while(cur.width>w*2)cur=azDraw(cur,Math.round(cur.width/2),Math.round(cur.height/2));
  return azDraw(cur,w,h);
}
function azSharpen(c,a){
  var x=c.getContext("2d"),w=c.width,h=c.height,img=x.getImageData(0,0,w,h),d=img.data,o=new Uint8ClampedArray(d);
  for(var y=1;y<h-1;y++)for(var i=(y*w+1)*4,e=(y*w+w-1)*4;i<e;i+=4)for(var k=0;k<3;k++){var p=i+k;d[p]=o[p]+a*(4*o[p]-o[p-4]-o[p+4]-o[p-w*4]-o[p+w*4])/4}
  x.putImageData(img,0,0);
}
function azCompress(im){
  var old=azScale(im,720).toDataURL("image/jpeg",.8),limit=Math.min(old.length,180000);
  try{
    var type=document.createElement("canvas").toDataURL("image/webp").indexOf("data:image/webp")===0?"image/webp":"image/jpeg";
    var sizes=type==="image/webp"?[1080,900,720]:[900,720];
    for(var n=0;n<sizes.length;n++){
      var c=azScale(im,sizes[n]);
      if(c.width<im.width)azSharpen(c,.25);
      var lo=n===sizes.length-1?.5:.72,hi=.92,best=c.toDataURL(type,lo);
      if(best.length>limit)continue;
      for(var j=0;j<5;j++){var q=(lo+hi)/2,u=c.toDataURL(type,q);if(u.length<=limit){best=u;lo=q}else hi=q}
      return best;
    }
  }catch(e){}
  return old;
}

function azRenderMediaCard(item, kind) {
  const photos = Array.isArray(item.photos) ? item.photos.filter(Boolean) : [];
  const vid = item.video || "";
  let html = "";
  if (photos.length) {
    html += (kind === "event" || kind === "band") ? azSlider(photos, kind === "band" || !!(item.tier || item.tier_name)) : '<div class="mgrid" style="margin:8px 0">' + photos.map((u, i) => '<div class="mth"><img src="' + esc(u) + '" alt="Photo ' + (i+1) + '"></div>').join("") + '</div>';
  }
  if (vid) {
    html += '<div class="mth vid" style="margin:8px 0"><video src="' + esc(vid) + '" controls playsinline preload="metadata"></video></div>';
  }
  return html;
}

function azRenderPublicCards(kind, filterFn) {
  if (!Array.isArray(AZ_PUBLIC_POSTS) || !AZ_PUBLIC_POSTS.length) return "";
  return AZ_PUBLIC_POSTS.filter(row => {
    if (!row) return false;
    const k = String(row.kind || row.post_kind || "").trim();
    if (k !== kind) return false;
    const rawData = row.data && typeof row.data === "object" ? row.data : {};
    const item = Object.assign({
      id: row.id,
      title: rawData.title || row.title || "",
      desc: rawData.desc || row.description || "",
      loc: rawData.loc || row.location || "",
      con: rawData.con || row.contact || "",
      by: row.author_name || rawData.by || "",
      phone: row.author_phone || "",
      created_at: row.created_at || row.visible_from || "",
      photos: rawData.photos || [],
      video: rawData.video || ""
    }, rawData);
    return typeof filterFn === "function" ? filterFn(item, row) : true;
  }).sort(function(a,b){return kind==="event"?azTier(b)-azTier(a):0}).map(row => {
    const rawData = row.data && typeof row.data === "object" ? row.data : {};
    const title = rawData.title || rawData.desc || (kind === "store" ? t("store") : kind === "seek" ? "Job seeker" : kind === "band" ? "Band" : kind === "event" ? "Event" : "Job offer");
    const desc = rawData.desc || "";
    const loc = rawData.loc || "";
    const con = rawData.con || row.author_phone || "";
    const dt = row.visible_from || row.created_at;
    return '<div class="card"><b>' + esc(title) + '</b>' +
      (loc ? '<div class="mu">' + esc(loc) + (dt ? " · " + new Date(dt).toLocaleDateString() : "") + '</div>' : "") +
      (desc && desc !== title ? '<p class="mu">' + esc(desc) + '</p>' : "") +
      azRenderMediaCard(rawData, kind) + azEvExtra(kind, row, rawData) +
      who(row.author_name || "Member", "Approved post", kind === "band" ? "★ Golden Badge" : "") +
      (con ? jobLink(con) : "") + '</div>';
  }).join("");
}

async function azLoadPublicPosts(force) {
  const sb = window.azSupabase;
  if (!sb || AZ_POSTS_LOADING) return;
  if (!force && Date.now() - AZ_POSTS_LAST_FETCH < 20000) return;
  AZ_POSTS_LOADING = true;
  try {
    const r = await sb.rpc("app_list_posts");
    if (!r.error && Array.isArray(r.data)) {
      AZ_PUBLIC_POSTS = r.data;
      AZ_POSTS_LAST_FETCH = Date.now();
      if (typeof render === "function") render();
    }
  } catch (e) {}
  finally {
    AZ_POSTS_LOADING = false;
  }
}

function openPostPay(opts) {
  const label = opts.label, amount = opts.amount, kind = opts.kind, productCode = opts.productCode, postData = opts.data, done = opts.done;
  const m = document.createElement("div");
  m.className = "sheet";
  m.innerHTML = '<div role="dialog" aria-label="' + esc(label) + '"><h3>' + esc(label) + '</h3><p class="mu">' + t("total") + ': <b>' + fmt(amount) + ' birr</b></p><p class="tt">Kindly transfer the total amount by Telebirr to +251911898184, or to CBE account 1000037200534 (account holder: Nahom Zewge Tesfaye). Then enter your transaction ID below and submit it for verification.</p><div class="chips" id="pm"><button type="button" class="chip on" data-m="Telebirr">Telebirr</button><button type="button" class="chip" data-m="CBE">CBE</button></div><label for="prf">' + t("ref") + '</label><input id="prf" autocomplete="off" autocapitalize="characters"><label for="prt">Payment time shown on your receipt (optional)</label><input id="prt" type="time" step="1"><button class="btn" id="pgo" type="button">' + esc(t("pay_submit")) + '</button><button class="btn ln" id="pcx" type="button">✕</button></div>';
  document.body.appendChild(m);
  let meth = "Telebirr";
  m.querySelector("#pm").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    meth = b.dataset.m;
    m.querySelectorAll("#pm .chip").forEach(c => c.classList.toggle("on", c === b));
  };
  m.querySelector("#pcx").onclick = () => m.remove();
  m.querySelector("#pgo").onclick = async () => {
    const rv = m.querySelector("#prf").value.trim();
    if (!/^[A-Za-z0-9]{6,40}$/.test(rv)) {
      toast("Please enter a valid transaction ID (6 to 40 letters or numbers).");
      return;
    }
    if (!window.azSubmitPaidPost) {
      toast("Post payment helper not loaded. Reload the app.");
      return;
    }
    const gb = m.querySelector("#pgo");
    gb.disabled = true;
    const res = await window.azSubmitPaidPost({
      acct: acct, kind: kind, productCode: productCode, ref: rv, method: meth,
      ptime: (m.querySelector("#prt") || {}).value || null, data: postData
    });
    if (!res || !res.ok) {
      gb.disabled = false;
      toast((res && res.msg) || "Could not submit post. Try again.");
      return;
    }
    m.remove();
    azPaidDone();
    done && done(res);
  };
}
