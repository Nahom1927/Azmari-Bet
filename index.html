<script>
(function(){
const ld=(k,d)=>{try{return JSON.parse(load(k))||d}catch(e){return d}},sv=(k,v)=>store(k,JSON.stringify(v));
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),hm=()=>new Date().toTimeString().slice(0,5),g=id=>document.getElementById(id);
const INS=["Krar","Masinko","Washint","Begena","Kebero","Piano","Guitar","Vocal"],SS=[["P","Present"],["L","Late"],["A","Absent"],["E","Excused"]],TS=[["P","Present"],["L","Late"],["A","Absent"],["V","Leave"]];
let ST=ld("ab_st",[[1,"Selam Tadesse","Krar"],[2,"Abel Girma","Guitar"],[3,"Chala Gemechu","Kebero"],[4,"Amina Yusuf","Vocal"],[5,"Hana Getachew","Piano"]].map(a=>({id:a[0],n:a[1],i:a[2]})));
let TC=ld("ab_tc",[{id:1,n:"Meron Bekele",i:"Krar and masinko"},{id:2,n:"Yonas Haile",i:"Guitar and bass"},{id:3,n:"Tigist Mulugeta",i:"Piano and vocal"}]),SA=ld("ab_sa",{}),TA=ld("ab_ta",{}),TM=false,AX={d:td(),s:"Morning"},TD=td(),LF="All",PLAY=null,LSN=[],OU={};
const LG='<img class="acl" src="images/logo.png" alt="Azmari Music Academy">';
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return"p"+h+"x"+s.length};
const DB=()=>new Promise((o,x)=>{const r=indexedDB.open("azmari",1);r.onupgradeneeded=()=>r.result.createObjectStore("lessons",{keyPath:"id"});r.onsuccess=()=>o(r.result);r.onerror=()=>x(r.error)});
const dbp=(m,a,w)=>DB().then(d=>new Promise((o,x)=>{const q=d.transaction("lessons",w?"readwrite":"readonly").objectStore("lessons")[m](a);q.onsuccess=()=>o(q.result);q.onerror=()=>x(q.error)}));
const loadL=()=>dbp("getAll").then(a=>{LSN=a.sort((x,y)=>y.t-x.t);if(view==="lessons")render()}).catch(()=>{});
const cs=(a,cur,x,pre)=>a.map(([k,l])=>`<button type="button" class="chip ${cur===k?"on":""}" data-x="${x}" data-v="${pre}${k}">${l}</button>`).join("");
const stat=(D,id,f=v=>v)=>{let p=0,t=0;for(const k in D){const v=f(D[k][id]);if(!v||v==="E"||v==="V")continue;t++;if(v==="P"||v==="L")p++}return p+"/"+t+" · "+(t?Math.round(p*100/t)+"%":"–")};
const lockBar=()=>TM?`<div class="rw"><span class="badge ok">Teacher mode</span><button type="button" class="chip" data-x="lock">🔒 Lock</button></div>`:`<div class="card"><b>Teacher mode</b><p class="mu">Teachers: enter your PIN to upload lessons and take attendance.</p><button type="button" class="btn" data-x="unlock">🔑 Unlock</button></div>`;
const addForm=(p,ph)=>`<div class="card"><h3>Add ${ph}</h3><input class="fi" id="${p}n" placeholder="Full name" autocomplete="off"><select class="f fi" id="${p}i">${INS.map(i=>`<option>${i}</option>`).join("")}</select><button type="button" class="btn" data-x="${p}add">＋ Add ${ph}</button></div>`;
function emb(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(m)return"https://www.youtube-nocookie.com/embed/"+m[1];m=u.match(/vimeo\.com\/(\d+)/);return m?"https://player.vimeo.com/video/"+m[1]:null}
function lItem(l){let p="";if(PLAY===l.id){if(l.blob){OU[l.id]=OU[l.id]||URL.createObjectURL(l.blob);p=`<video class="vd" src="${OU[l.id]}" controls playsinline autoplay></video>`}else{const e=emb(l.link);p=e?`<iframe class="vd" src="${e}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`:`<a class="btn" href="${esc(l.link)}" target="_blank" rel="noopener">Open video ↗</a>`}}
return `<div class="card"><div class="rw"><b>${esc(l.title)}</b><span class="badge">${esc(l.inst)}</span></div><div class="mu">${esc(l.by)} · ${new Date(l.t).toLocaleDateString()}${l.blob?" · on this device":" · link"}</div>${l.desc?`<p class="mu">${esc(l.desc)}</p>`:""}${p||`<button type="button" class="btn" data-x="play" data-v="${l.id}">▶ Watch</button>`}${TM?`<button type="button" class="chip" data-x="del" data-v="${l.id}" style="margin-top:8px">🗑 Delete</button>`:""}</div>`}
V.lessons=()=>{const L=LSN.filter(l=>LF==="All"||l.inst===LF);return `${LG}<h2>🎬 Video lessons</h2>${lockBar()}${TM?`<div class="card"><h3>Upload a lesson</h3><input class="fi" id="lt" placeholder="Lesson title" maxlength="80"><select class="f fi" id="li">${INS.map(i=>`<option>${i}</option>`).join("")}</select><textarea class="fi" id="ld" rows="2" maxlength="300" placeholder="Short description (optional)"></textarea><label for="lf">Video file (max 300 MB)</label><input class="fi" id="lf" type="file" accept="video/*"><label for="ll">…or YouTube / Vimeo link</label><input class="fi" id="ll" type="url" placeholder="https://"><button type="button" class="btn" data-x="up">⬆ Upload lesson</button></div>`:""}<div class="chips">${["All",...INS].map(i=>`<button type="button" class="chip ${LF===i?"on":""}" data-x="lf" data-v="${i}">${i}</button>`).join("")}</div>${L.length?L.map(lItem).join(""):`<div class="card"><p class="mu">No lessons yet.</p></div>`}<p class="tt">Files uploaded here stay on this device. Add a YouTube or Vimeo link so every student can watch.</p>`};
V.attend=()=>{const k=AX.d+"|"+AX.s,m=SA[k]||{},me=ST.find(s=>s.n.toLowerCase()===String(S.reg.name||"").trim().toLowerCase());let h=`${LG}<h2>📋 Student attendance</h2>`;if(me)h+=`<div class="card"><b>Your attendance</b><p class="mu">${stat(SA,me.id)}</p></div>`;h+=lockBar();if(!TM)return h;
return h+`<div class="card"><input class="fi" type="date" data-x="ad" value="${AX.d}"><div class="chips">${["Morning","Afternoon","Evening","Weekend"].map(s=>`<button type="button" class="chip ${AX.s===s?"on":""}" data-x="ses" data-v="${s}">${s}</button>`).join("")}</div><button type="button" class="btn ln" data-x="allp">✓ Mark all present</button></div>${ST.map(s=>`<div class="card"><div class="rw"><b>${esc(s.n)}</b><button type="button" class="chip" data-x="srem" data-v="${s.id}" aria-label="Remove">✕</button></div><div class="mu">${esc(s.i)} · Total ${stat(SA,s.id)}</div><div class="chips">${cs(SS,m[s.id],"sg",s.id+"|")}</div></div>`).join("")}${addForm("s","student")}<p class="tt">Late counts as attended. Excused days are not counted.</p>`};
V.tattend=()=>{const m=TA[TD]||{};let h=`${LG}<h2>🧑‍🏫 Teacher attendance</h2>${lockBar()}`;if(!TM)return h;
return h+`<div class="card"><input class="fi" type="date" data-x="td" value="${TD}"></div>${TC.map(t=>{const r=m[t.id]||{};return `<div class="card"><div class="rw"><b>${esc(t.n)}</b><button type="button" class="chip" data-x="trem" data-v="${t.id}" aria-label="Remove">✕</button></div><div class="mu">${esc(t.i)} · Total ${stat(TA,t.id,v=>v&&v.s)}</div><div class="mu">In ${r.in||"–"} · Out ${r.out||"–"}</div><div class="chips">${cs(TS,r.s,"ta",t.id+"|")}</div><div class="rw"><button type="button" class="btn ln" data-x="tin" data-v="${t.id}">⏱ Check in</button><button type="button" class="btn ln" data-x="tout" data-v="${t.id}">⏱ Check out</button></div></div>`}).join("")}${addForm("t","teacher")}`};
const oh=V.home,om=V.more,oz=V.zone,oa=V.academy,links=`<button type="button" class="sec" data-go="lessons"><span class="ic">🎬</span><b>Video lessons</b></button><button type="button" class="sec" data-go="attend"><span class="ic">📋</span><b>Student attendance</b></button><button type="button" class="sec" data-go="tattend"><span class="ic">🧑‍🏫</span><b>Teacher attendance</b></button>`;
V.home=()=>oh().replace('<div class="card" style="margin-top:12px">',`<div class="grid" style="margin-top:12px"><button type="button" class="tile" data-go="lessons"><b>🎬</b>Video lessons</button><button type="button" class="tile" data-go="attend"><b>📋</b>Attendance</button><button type="button" class="tile" data-go="tattend" style="grid-column:1/-1"><b>🧑‍🏫</b>Teacher attendance</button></div><div class="card" style="margin-top:12px">`);
V.more=()=>om()+links;
V.academy=()=>{const h=oa();return S.reg.status==="paid"?h:LG+h};
V.zone=()=>{let h=oz();const me=ST.find(s=>s.n.toLowerCase()===String(S.reg.name||"").trim().toLowerCase());if(me){const a=stat(SA,me.id);h=h.replace('Attendance 18 / 20<div class="meter"><i style="width:90%"></i></div>',`Attendance ${a.split(" · ")[0]}<div class="meter"><i style="width:${parseInt(a.split(" · ")[1])||0}%"></i></div>`)}return LG+h+links};
document.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x,v=b.dataset.v;
if(["up","sg","allp","sadd","srem","tadd","trem","ta","tin","tout","del"].includes(x)&&!TM)return;
switch(x){
case"unlock":{const h=load("ab_pin"),p=prompt(h?"Teacher PIN":"Create a Teacher PIN (4+ characters)");if(!p)return;if(!h){if(p.length<4){toast("PIN too short");return}store("ab_pin",hs(p));TM=true}else if(hs(p)===h)TM=true;else{toast("Wrong PIN");return}break}
case"lock":TM=false;break;case"lf":LF=v;break;case"play":PLAY=+v;break;case"ses":AX.s=v;break;
case"del":if(!confirm("Delete this lesson?"))return;delete OU[v];dbp("delete",+v,1).then(loadL);return;
case"up":{if(needAcct())return;const title=g("lt").value.trim(),link=g("ll").value.trim(),desc=g("ld").value.trim(),f=g("lf").files[0];
if(!title||(!f&&!link)){toast("Add a title and a video file or link");return}
const bad=modr(title+" "+desc);if(bad){toast("Blocked: "+bad);return}
if(!f&&!/^https:\/\//i.test(link)){toast("Link must start with https://");return}
if(f&&(!/^video\//.test(f.type)||f.size>3e8)){toast("Choose a video under 300 MB");return}
const rec={id:Date.now(),t:Date.now(),title,desc,inst:g("li").value,by:(acct&&acct.name)||"Teacher"};if(f)rec.blob=f;else rec.link=link;
toast("Saving…");dbp("put",rec,1).then(()=>{toast("Lesson saved");try{navigator.storage.persist()}catch(e){}return loadL()}).catch(()=>toast("Could not save. Is storage full?"));return}
case"sg":{const[i,s]=v.split("|"),k=AX.d+"|"+AX.s,r=SA[k]=SA[k]||{};r[i]=r[i]===s?"":s;sv("ab_sa",SA);break}
case"allp":{const k=AX.d+"|"+AX.s,r=SA[k]=SA[k]||{};ST.forEach(s=>r[s.id]="P");sv("ab_sa",SA);break}
case"ta":{const[i,s]=v.split("|"),d=TA[TD]=TA[TD]||{};d[i]=Object.assign({},d[i],{s:d[i]&&d[i].s===s?"":s});sv("ab_ta",TA);break}
case"tin":case"tout":{const d=TA[TD]=TA[TD]||{},r=d[v]=d[v]||{};if(x==="tin"){r.in=hm();if(!r.s)r.s="P"}else r.out=hm();sv("ab_ta",TA);break}
case"sadd":case"tadd":{const T=x==="sadd",p=T?"s":"t",n=g(p+"n").value.trim();if(!n){toast("Write a name");return}(T?ST:TC).push({id:Date.now(),n,i:g(p+"i").value});sv(T?"ab_st":"ab_tc",T?ST:TC);break}
case"srem":if(!confirm("Remove this student?"))return;ST=ST.filter(s=>s.id!=v);sv("ab_st",ST);break;
case"trem":if(!confirm("Remove this teacher?"))return;TC=TC.filter(s=>s.id!=v);sv("ab_tc",TC);break;
default:return}
render()});
document.addEventListener("change",e=>{const b=e.target.closest("[data-x]");if(!b)return;if(b.dataset.x==="ad")AX.d=b.value||td();else if(b.dataset.x==="td")TD=b.value||td();else return;render()});
loadL();
})();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
