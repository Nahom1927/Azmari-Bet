<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;padding:16px;background:#0b1020;color:#fff}
</style>

<style id="azmari-responsive-mobile">
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: pan-y;
}

body {
  width: 100%;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
  overflow-y: auto;
  touch-action: pan-y;
}

img, video, canvas, iframe {
  max-width: 100%;
}

input, select, textarea {
  font-size: 16px;
}
</style>

</head><body>
<h2>Azmari Bet Admin</h2>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb = supabase.createClient("https://rnqizccrzbolsynfsxbu.supabase.co", "sb_publishable_1pbzO1FOGTjIjjE-yF7d1A__OFPESB2");
var app = document.getElementById("app");
var tab = "pending";

function el(tag, text, css) {
  var e = document.createElement(tag);
  if (text) e.textContent = text;
  if (css) e.style.cssText = css;
  return e;
}
function btn(text, fn, bg) {
  var b = el("button", text, "padding:10px 14px;margin:4px 6px 0 0;border:0;border-radius:8px;font-size:15px;color:#000;background:" + (bg || "#29c5ff"));
  b.onclick = fn;
  return b;
}
function field(type, ph) {
  var i = el("input", "", "display:block;width:100%;box-sizing:border-box;padding:10px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #556;background:#fff;color:#000");
  i.type = type; i.placeholder = ph;
  return i;
}

function login(msg) {
  app.textContent = "";
  var em = field("email", "Admin email");
  var pw = field("password", "Password");
  var note = el("p", msg || "", "color:#ffb3b3");
  app.appendChild(em);
  app.appendChild(pw);
  app.appendChild(btn("Log in", async function () {
    var r = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (r.error) note.textContent = r.error.message; else load();
  }));
  app.appendChild(note);
}

async function decide(o, approve) {
  var q = approve
    ? "Approve? Confirm you saw at least " + o.price + " ETB with transaction ID " + o.reference + " in YOUR OWN Telebirr/CBE records."
    : "Reject order " + o.reference + "?";
  if (!confirm(q)) return;
  var r = await sb.rpc("admin_decide_order", { p_id: o.id, p_approve: approve });
  if (r.error) alert(r.error.message); else load();
}

async function decidePost(post, approve) {
  var refTxt = post.reference ? " (transaction " + post.reference + ")" : "";
  var needsPay = post.payment_status !== "verified" && post.payment_status !== "not_required";
  var q = approve
    ? (needsPay
        ? "Approve post #" + String(post.id).slice(0, 8) + refTxt + "?\nConfirm you saw this payment in YOUR OWN Telebirr/CBE records. It goes live for 60 days."
        : "Approve post #" + String(post.id).slice(0, 8) + " so it goes live for 60 days?")
    : "Reject post #" + String(post.id).slice(0, 8) + refTxt + "?";
  if (!confirm(q)) return;
  if (approve && needsPay) {
    var pr = await sb.rpc("app_admin_update_post_payment", { p_id: post.id, p_verified: true, p_note: "Verified by admin on approval" });
    if (pr.error) { alert("Could not mark payment verified: " + pr.error.message); return; }
  }
  var r = await sb.rpc("app_admin_decide_post", { p_id: post.id, p_approve: approve });
  if (r.error) alert(r.error.message); else load();
}

function renderPostsTab(container) {
  container.appendChild(el("p", "Loading pending posts...", "opacity:.8"));
  sb.rpc("admin_list_pending_posts").then(function (r) {
    container.textContent = "";
    if (r.error) {
      container.appendChild(el("p", "Error loading posts: " + r.error.message, "color:#ffb3b3"));
      return;
    }
    var list = Array.isArray(r.data) ? r.data : [];
    if (!list.length) {
      container.appendChild(el("p", "No pending posts."));
      return;
    }
    list.forEach(function (post) {
      var d = post.data && typeof post.data === "object" ? post.data : {};
      var card = el("div", "", "border:1px solid #445;border-radius:10px;padding:12px;margin:10px 0;background:#141b33");
      card.appendChild(el("div", (d.title || post.kind || "Post") + " · " + (post.kind || "item") + (post.price != null ? " · " + post.price + " ETB" : ""), "font-weight:bold;font-size:17px"));
      card.appendChild(el("div", (post.author_name || post.customer_name || "(no name)") + " · " + (post.author_phone || post.customer_phone || "no phone"), "font-weight:bold"));
      if (post.reference) card.appendChild(el("div", "Transaction ID: " + post.reference, "font-family:monospace;margin:4px 0"));
      if (post.pay_method) card.appendChild(el("div", "Paid via " + post.pay_method + (post.paid_time ? " at " + post.paid_time : "") + " · payment: " + (post.payment_status || "pending")));
      if (d.loc) card.appendChild(el("div", "Place: " + d.loc));
      if (d.con) card.appendChild(el("div", "Contact: " + d.con));
      if (d.desc) card.appendChild(el("div", d.desc, "margin:6px 0;opacity:.92"));
      if (Array.isArray(d.photos) && d.photos.length) {
        var pw = el("div", "", "display:flex;gap:8px;flex-wrap:wrap;margin:8px 0");
        d.photos.forEach(function (u) {
          if (!u) return;
          var im = el("img", "");
          im.src = u;
          im.style.cssText = "width:96px;height:96px;object-fit:cover;border-radius:8px";
          pw.appendChild(im);
        });
        card.appendChild(pw);
      }
      if (d.video) {
        var vd = el("video", "");
        vd.src = d.video;
        vd.controls = true;
        vd.preload = "metadata";
        vd.style.cssText = "max-width:260px;border-radius:8px;margin:8px 0;display:block";
        card.appendChild(vd);
      }
      if (post.created_at) {
        card.appendChild(el("div", "Submitted: " + new Date(post.created_at).toLocaleString("en-GB", {timeZone:"Africa/Addis_Ababa",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}), "opacity:.85;font-size:13px"));
      }
      card.appendChild(btn("Approve Post", function () { decidePost(post, true); }, "#5ee38a"));
      card.appendChild(btn("Reject Post", function () { decidePost(post, false); }, "#ff8a8a"));
      container.appendChild(card);
    });
  });
}

async function load() {
  var s = (await sb.auth.getSession()).data.session;
  if (!s) { login(); return; }
  var r = null;
  if (tab !== "posts") {
    r = tab === "expiring" ? await sb.rpc("admin_expiring", { p_days: 7 }) : await sb.rpc("admin_list_orders", { p_status: tab });
  }
  app.textContent = "";
  var top = el("div", "", "margin-bottom:12px");
  ["pending", "posts", "approved", "rejected", "expiring"].forEach(function (t) {
    top.appendChild(btn(t, function () { tab = t; load(); }, t === tab ? "#29c5ff" : "#8899aa"));
  });
  top.appendChild(btn("Refresh", load, "#cfd8e3"));
  top.appendChild(btn("Log out", async function () { await sb.auth.signOut(); login(); }, "#cfd8e3"));
  app.appendChild(top);
  if (tab === "posts") { var pWrap = el("div", ""); app.appendChild(pWrap); renderPostsTab(pWrap); return; }
  if (r.error) { app.appendChild(el("p", "Not allowed or error: " + r.error.message, "color:#ffb3b3")); return; }
  if (!r.data.length) { app.appendChild(el("p", "No " + tab + " orders.")); return; }
  r.data.forEach(function (o) {
    var card = el("div", "", "border:1px solid #445;border-radius:10px;padding:12px;margin:10px 0;background:#141b33");
    card.appendChild(el("div", o.product_name + (o.price != null ? " · " + o.price + " ETB" : ""), "font-weight:bold;font-size:17px"));
    card.appendChild(el("div", (o.customer_name || "(no name)") + " · " + (o.customer_phone || "no phone"), "font-weight:bold"));if (o.email) card.appendChild(el("div", o.email));
    if (o.reference) card.appendChild(el("div", "Transaction ID: " + o.reference, "font-family:monospace;margin:4px 0"));
    if (o.item_ref) card.appendChild(el("div", "Item: " + o.item_ref));
    if (o.expires_at) card.appendChild(el("div", "Expires: " + new Date(o.expires_at).toLocaleDateString("en-GB", {timeZone:"Africa/Addis_Ababa"}) + " (" + o.days_left + " days left)", "color:#ffd27a;font-weight:bold")); if (o.created_at) card.appendChild(el("div", "Submitted: " + new Date(o.created_at).toLocaleString("en-GB", {timeZone:"Africa/Addis_Ababa",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}) + (o.paid_time ? " · Receipt time: " + o.paid_time : "") + (o.pay_method ? " · " + o.pay_method : ""), "opacity:.85;font-size:13px"));
    if (tab === "pending") {
      card.appendChild(btn("Approve", function () { decide(o, true); }, "#5ee38a"));
      card.appendChild(btn("Reject", function () { decide(o, false); }, "#ff8a8a"));
    }
    app.appendChild(card);
  });
}
load();
</script>
</body></html>
