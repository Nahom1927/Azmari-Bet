<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azmari admin · Posts</title>
<style>body{font-family:system-ui;background:#eef4ff;color:#0d1b3a;margin:0;padding:16px;max-width:640px;margin:auto}
.c{background:#fff;border:1px solid #d3dcf2;border-radius:12px;padding:12px;margin:10px 0}
button{background:#0a66ff;color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:4px 4px 0 0;font-weight:600}
button.n{background:#b23a30}input,select{padding:10px;margin:4px 0;width:100%;box-sizing:border-box;border:1px solid #d3dcf2;border-radius:8px}</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://rnqizccrzbolsynfsxbu.supabase.co","sb_publishable_1pbzO1FOGTjIjjE-yF7d1A__OFPESB2");
var app=document.getElementById("app");
function el(t,x,a){var e=document.createElement(t);if(x!=null)e.textContent=x;Object.assign(e,a||{});return e}
function login(){app.textContent="";var e=el("input",null,{placeholder:"Email"}),p=el("input",null,{placeholder:"Password",type:"password"}),m=el("p");
app.append(el("h2","Admin login"),e,p,el("button","Log in",{onclick:async function(){var r=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(r.error)m.textContent=r.error.message;else panel()}}),m)}
async function panel(){app.textContent="";var st=el("select");["pending","approved","rejected"].forEach(function(s){st.appendChild(el("option",s,{value:s}))});
var list=el("div"),msg=el("p");
async function draw(){list.textContent="";var r=await sb.rpc("app_admin_list_posts",{p_status:st.value});
if(r.error){msg.textContent=r.error.message;return}msg.textContent=(r.data||[]).length+" posts";
(r.data||[]).forEach(function(x){var c=el("div",null,{className:"c"}),d=x.data||{};
c.append(el("b",d.title||x.kind),el("div",(d.loc||"")+" · "+(x.author_name||"")+" · "+(x.author_phone||"")),el("div",d.desc||""));
if(x.status!=="approved")c.append(el("button","Approve",{onclick:async function(){await sb.rpc("app_admin_decide_post",{p_id:x.id,p_approve:true});draw()}}));
if(x.status!=="rejected")c.append(el("button","Reject",{className:"n",onclick:async function(){await sb.rpc("app_admin_decide_post",{p_id:x.id,p_approve:false});draw()}}));
list.appendChild(c)})}
st.onchange=draw;
var ph=el("input",null,{placeholder:"Phone to reset edits"}),rm=el("p");
app.append(el("h2","Posts"),st,msg,list,el("h3","Reset registration edits"),ph,
el("button","Reset to 3",{onclick:async function(){var r=await sb.rpc("app_admin_reset_edits",{p_phone:ph.value.trim()});rm.textContent=r.error?r.error.message:"Reset done"}}),rm,
el("button","Log out",{onclick:async function(){await sb.auth.signOut();login()}}));draw()}
sb.auth.getSession().then(function(s){if(s.data.session)panel();else login()});
</script></body></html>
