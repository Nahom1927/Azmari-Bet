<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop admin</title>
<style>
body{margin:0;background:#0a0f1c;color:#e8ecf4;font:16px system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:18px}
h1{font-size:1.4rem}input{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border-radius:10px;border:1px solid #2a3350;background:#141b30;color:#fff;font-size:1rem}
button{padding:10px 16px;border:0;border-radius:10px;background:#22d3ee;color:#04121f;font-weight:700;cursor:pointer;font-size:.95rem}
button.alt{background:#2a3350;color:#e8ecf4}button.bad{background:#e5484d;color:#fff}button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{background:#141b30;color:#e8ecf4}.tabs button.on{background:#22d3ee;color:#04121f}
.card{background:#141b30;border:1px solid #2a3350;border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px}.meta{opacity:.75;font-size:.9em;line-height:1.6}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:10px;margin-top:10px}.err{color:#ff7b7b;margin:8px 0}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SB_URL = 'https://rnqizccrzbolsynfsxbu.supabase.co', SB_KEY = 'sb_publishable_1pbzO1FOGTjIjjE-yF7d1A__OFPESB2';
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'azs-auth', persistSession: true, autoRefreshToken: true } });
  var app = document.getElementById('app'), tab = 'pending';
  function h(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'onclick') e.onclick = attrs[k]; else e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
    return e;
  }
  function show() { app.replaceChildren.apply(app, arguments); }

  function loginView(msg) {
    var em = h('input', { type: 'email', placeholder: 'Admin email', autocomplete: 'email' });
    var pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
    var err = h('div', { class: 'err' }, msg || '');
    var go = h('button', { onclick: async function () {
      go.disabled = true; err.textContent = '';
      var r = await sb.auth.signInWithPassword({ email: em.value.trim().toLowerCase(), password: pw.value });
      go.disabled = false;
      if (r.error) { err.textContent = /invalid login/i.test(r.error.message) ? 'Wrong email or password' : r.error.message; return; }
      start();
    } }, 'Log in');
    show(h('h1', {}, 'Shop admin login'), em, pw, err, go);
  }

  async function start() {
    var s = await sb.auth.getSession();
    if (!s.data.session) return loginView();
    var p = await sb.from('azs_profiles').select('role,name').eq('id', s.data.session.user.id).maybeSingle();
    if (p.error || !p.data || p.data.role !== 'admin') {
      await sb.auth.signOut();
      return loginView('This account is not an admin.');
    }
    listView();
  }

  async function listView() {
    var tabs = h('div', { class: 'tabs' });
    ['pending', 'approved', 'rejected'].forEach(function (t) {
      tabs.append(h('button', { class: t === tab ? 'on' : '', onclick: function () { tab = t; listView(); } }, t[0].toUpperCase() + t.slice(1)));
    });
    var out = h('div', {}, 'Loading...');
    show(h('h1', {}, 'Shop admin'), h('button', { class: 'alt', onclick: async function () { await sb.auth.signOut(); loginView(); } }, 'Log out'), tabs, out);
    var r = await sb.from('azs_listings').select('*').eq('status', tab).order('created_at', { ascending: false }).limit(100);
    if (r.error) { out.replaceChildren(h('div', { class: 'err' }, r.error.message)); return; }
    if (!r.data.length) { out.replaceChildren(h('p', { class: 'meta' }, 'No ' + tab + ' ads.')); return; }
    out.replaceChildren.apply(out, r.data.map(card));
  }

  function card(l) {
    var imgs = h('div', { class: 'imgs' });
    (l.images || []).forEach(function (u) {
      if (/^https:\/\//.test(u)) imgs.append(h('a', { href: u, target: '_blank', rel: 'noopener' }, h('img', { src: u, alt: '' })));
    });
    var err = h('div', { class: 'err' });
    function setStatus(v) {
      return async function () {
        err.textContent = '';
        var r = await sb.from('azs_listings').update({ status: v, verified: v === 'approved' }).eq('id', l.id).select();
        if (r.error) { err.textContent = r.error.message; return; }
        if (!r.data.length) { err.textContent = 'Not allowed. Run the admin policy SQL.'; return; }
        listView();
      };
    }
    var btns = h('div', { class: 'row' });
    if (l.status !== 'approved') btns.append(h('button', { onclick: setStatus('approved') }, 'Approve'));
    if (l.status !== 'rejected') btns.append(h('button', { class: 'bad', onclick: setStatus('rejected') }, 'Reject'));
    return h('div', { class: 'card' },
      h('h3', {}, l.title + ' - ' + l.price + ' birr'),
      h('div', { class: 'meta' }, 'Seller: ' + l.seller_name + ' | ' + l.category + ' | ' + (l.city || '')),
      h('div', { class: 'meta' }, 'Fee: ' + (l.fee || 0) + ' birr' + (l.pay_ref ? ' | Payment ref: ' + l.pay_ref : '')),
      h('p', {}, l.description || ''), imgs, btns, err);
  }
  start();
})();
</script></body></html>
